<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gece</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02030a;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize(){
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
    makeText();
}

window.addEventListener("resize",resize);

const falling = [];
const textParticles = [];

const FALL_COUNT = 180;

class FallingParticle{

    constructor(){
        this.reset(true);
    }

    reset(first=false){

        this.x = Math.random()*W;
        this.y = first
            ? Math.random()*H
            : -Math.random()*200;

        this.speed =
            Math.random()*2.5 + 1.5;

        this.size =
            Math.random()*2 + 0.6;

        this.alpha =
            Math.random()*0.7 + 0.3;
    }

    update(){

        this.y += this.speed;

        if(this.y > H){
            this.reset();
        }
    }

    draw(){

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            `rgba(255,238,100,${this.alpha})`;

        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ffee55";

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}

for(let i=0;i<FALL_COUNT;i++){
    falling.push(
        new FallingParticle()
    );
}

function makeText(){

    textParticles.length=0;

    const off =
        document.createElement("canvas");

    const octx =
        off.getContext("2d");

    off.width=W;
    off.height=H;

    const size =
        Math.min(W*0.23,130);

    octx.font =
        `bold ${size}px Arial`;

    octx.textAlign="center";
    octx.textBaseline="middle";
    octx.fillStyle="white";

    octx.fillText(
        "NİSAM",
        W/2,
        H/2
    );

    const data =
        octx.getImageData(
            0,0,W,H
        ).data;

    for(let y=0;y<H;y+=5){

        for(let x=0;x<W;x+=5){

            const i =
                (y*W+x)*4;

            if(data[i+3]>100){

                textParticles.push({

                    x:Math.random()*W,

                    y:-Math.random()*H,

                    tx:x,
                    ty:y,

                    vx:0,
                    vy:0,

                    size:
                        Math.random()*1.8+0.7,

                    alpha:
                        Math.random()*0.5+0.5
                });
            }
        }
    }
}

let started=false;

function formText(){

    if(!started){

        started=true;

        textParticles.forEach((p,i)=>{

            setTimeout(()=>{

                p.start=true;

            },i*3);

        });
    }

    for(const p of textParticles){

        if(!p.start) continue;

        const dx=p.tx-p.x;
        const dy=p.ty-p.y;

        p.vx += dx*0.009;
        p.vy += dy*0.009;

        p.vx*=0.91;
        p.vy*=0.91;

        p.x+=p.vx;
        p.y+=p.vy;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            `rgba(255,238,100,${p.alpha})`;

        ctx.shadowBlur=12;
        ctx.shadowColor="#ffee55";

        ctx.fill();

        ctx.shadowBlur=0;
    }
}

function animate(){

    ctx.fillStyle=
        "rgba(2,3,10,0.18)";

    ctx.fillRect(
        0,0,W,H
    );

    for(const p of falling){
        p.update();
        p.draw();
    }

    formText();

    requestAnimationFrame(animate);
}

resize();
animate();
</script>

</body>
</html>
